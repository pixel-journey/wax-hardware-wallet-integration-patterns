blueprint:
  id: wax-hardware-wallet-integration-patterns
  name: Hardware Wallet Integration Patterns
  tier: 1
  category: security-foundational
  status: refined
  version: "0.5.0"
  last_refined: "2026-10-18"

metadata:
  description: |
    Educational hardware wallet integration patterns for Antelope/WAX —
    readiness scoring, pitfalls, signing flow steps, permission layouts.
    Device SDKs age; invariants are the durable layer.
  related_blueprints:
    - wax-secure-key-management-and-privacy-tools
    - wax-multi-sig-proposal-builder-and-simulator
    - wax-social-recovery-and-key-backup-tools
    - wax-safe-key-rotation-assistant

invariants:
  - Host never handles seed material
  - Readiness and pitfalls are pure functions
  - Owner-not-daily is a first-class checklist item
  - Single-device-only designs are flagged

features:
  implemented:
    - scoreHardwareReadiness
    - analyzeHardwarePitfalls
    - ReadinessChecklist, PitfallsGuide, SigningFlowSteps, PermissionPatterns, demo

machine_instructions:
  - Use examples/engines.ts for scoring and pitfalls
  - Prefer WharfKit session patterns over custom key extraction
  - Do not freeze specific Ledger API versions as eternal truth

technical_requirements:
  framework: Next.js 15 + TypeScript (strict)
  styling: Tailwind CSS
  signing: WharfKit + vendor transports (app-pinned versions)
